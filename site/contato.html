      </ul>

  <main>
    <section>
      <h1>Entre em Contato</h1>
      <form action="#" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@gmail.com" required>
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Sua mensagem..." required></textarea>
        <button type="submit">Enviar</button>
      </form>
      <div class="info-contato">
        <p><h2>📍 Nossa Localização</h2>
          <p>
            Rua das Inovações, 123<br>
            Bairro Tecnologia<br>
            São Paulo - SP<br>
            CEP: 00000-000</p>
            <iframe 
        src="https://www.google.com/maps?q=São+Paulo&output=embed"
        width="300" 
        height="225" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy">
    </iframe>
        <p>Ligue para nós: (11) 8002-8922</p>
        <p>E-mail: pixelshop@gmail.com</p>
      </div>
    </section>
  </main>
