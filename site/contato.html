<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - [Nome da Empresa]</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="produtos.html">Produtos/Servicos</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h1>Entre em Contato</h1>
      <form action="#" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Sua mensagem..." required></textarea>
        <button type="submit">Enviar</button>
      </form>
      <div class="info-contato">
        <p>Endereco: [Endereco da empresa]</p>
        <p>Telefone: (11) 0000-0000</p>
        <p>E-mail: contato@empresa.com</p>
      </div>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 [Nome da Empresa]. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
